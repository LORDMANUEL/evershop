<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura AutoParts Commerce</title>
  <desc id="desc">Diagrama simplificado de los módulos principales del proyecto AutoParts Commerce.</desc>
  <rect width="640" height="360" fill="#0f172a" rx="16"/>
  <text x="320" y="40" text-anchor="middle" fill="#f8fafc" font-size="28" font-family="'Segoe UI',sans-serif">AutoParts Commerce</text>
  <g transform="translate(40,80)">
    <rect width="180" height="90" rx="12" fill="#1d4ed8"/>
    <text x="90" y="40" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="'Segoe UI',sans-serif">Storefront React</text>
    <text x="90" y="65" text-anchor="middle" fill="#bfdbfe" font-size="12" font-family="'Segoe UI',sans-serif">Selector de vehículo</text>
  </g>
  <g transform="translate(230,80)">
    <rect width="180" height="90" rx="12" fill="#2563eb"/>
    <text x="90" y="38" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="'Segoe UI',sans-serif">GraphQL API</text>
    <text x="90" y="63" text-anchor="middle" fill="#bfdbfe" font-size="12" font-family="'Segoe UI',sans-serif">Extensiones Auto_Fitment</text>
  </g>
  <g transform="translate(420,80)">
    <rect width="180" height="90" rx="12" fill="#1d4ed8"/>
    <text x="90" y="38" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="'Segoe UI',sans-serif">Servicios Backend</text>
    <text x="90" y="63" text-anchor="middle" fill="#bfdbfe" font-size="12" font-family="'Segoe UI',sans-serif">VIN, Importadores, Pagos</text>
  </g>
  <g transform="translate(140,200)">
    <rect width="180" height="90" rx="12" fill="#0ea5e9"/>
    <text x="90" y="38" text-anchor="middle" fill="#0f172a" font-size="16" font-family="'Segoe UI',sans-serif">Base de datos</text>
    <text x="90" y="63" text-anchor="middle" fill="#082f49" font-size="12" font-family="'Segoe UI',sans-serif">Postgres + tablas fitment</text>
  </g>
  <g transform="translate(330,200)">
    <rect width="180" height="90" rx="12" fill="#0ea5e9"/>
    <text x="90" y="38" text-anchor="middle" fill="#0f172a" font-size="16" font-family="'Segoe UI',sans-serif">Servicios externos</text>
    <text x="90" y="63" text-anchor="middle" fill="#082f49" font-size="12" font-family="'Segoe UI',sans-serif">vPIC, couriers, pagos</text>
  </g>
  <path d="M220 125h10" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M410 125h10" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M230 245h-10" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow-left)"/>
  <path d="M420 245h-10" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow-left)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f8fafc" />
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#f8fafc" />
    </marker>
  </defs>
</svg>
